<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="TruGoa">
  <title>TruGoa</title>
  <defs>
    <!-- Midday yellow at the top falling to a low sun red at the waterline. -->
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FFD93B"/>
      <stop offset="0.35" stop-color="#FDA92B"/>
      <stop offset="0.62" stop-color="#FF7F2E"/>
      <stop offset="0.82" stop-color="#FC5E24"/>
      <stop offset="1"    stop-color="#FA4A1C"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#FDF4EF"/>

  <circle cx="256" cy="251" r="146" fill="url(#sun)"/>

  <!-- The bands are painted in the background colour rather than clipped to the
       circle: outside the disc they land on identical cream and disappear, so
       the stripes need no mask to stop at the edge. They thicken towards the
       bottom, which is what reads as the sun sinking rather than as a barcode. -->
  <g fill="#FDF4EF">
    <rect x="0" y="279" width="512" height="9"/>
    <rect x="0" y="306" width="512" height="13"/>
    <rect x="0" y="336" width="512" height="17"/>
    <rect x="0" y="368" width="512" height="24"/>
  </g>

  <!-- Horizon. Sits flush with the base of the disc so the sun rests on it. -->
  <rect x="84" y="397" width="344" height="18" rx="9" fill="#142E26"/>
</svg>
