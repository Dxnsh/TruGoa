name: Keep backend awake

on:
  schedule:
    # Every 10 minutes — Render's free tier sleeps after ~15 min idle
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -sf --max-time 30 https://trugoa.onrender.com/health || echo "Ping failed (backend may be cold-starting)"
